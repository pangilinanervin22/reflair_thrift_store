name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # `prisma generate` (postinstall) only needs the variable to exist — no database is contacted.
      DATABASE_URL: mongodb://localhost:27017/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # No `next build` here: the storefront prerenders against the live database.
